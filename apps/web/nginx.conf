# apps/web 生产环境 Nginx 配置（Vite 构建出的纯静态 SPA）。
#
# 适配点说明：
# 1. Vite 构建产物文件名带 content hash（如 assets/index-abc123.js），内容不变 hash
#    必然不变——可以放心设置成"一年 + immutable"，浏览器/CDN 不需要再发条件请求校验。
# 2. index.html 是唯一引用当次构建 hash 文件名的入口，绝对不能被缓存，否则用户会一直
#    停留在发布前的版本，即使资源已经更新也感知不到（这是 SPA 部署里最容易踩的坑）。
# 3. react-router-dom 是纯前端路由（History API），直接刷新任意子路径（如 /wikis/1/docs/2）
#    时浏览器会真的向 nginx 请求这个路径，必须 try_files 兜底回 index.html 交给前端路由处理，
#    否则会拿到 404。
# 4. gzip 只对文本类资源开启：图片（png/jpg/webp）、字体（woff2）本身已经是压缩格式，
#    再 gzip 只会浪费 CPU、几乎没有收益。VITE_API_BASE_URL 这类接口地址是编译期常量，
#    已经固化进 JS 产物里，这里不需要也不应该反向代理 /api（详见 apps/web/Dockerfile 顶部说明）。

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;

    # 不暴露版本号，减少一点攻击面信息泄露
    server_tokens off;

    # ---------- 压缩 ----------
    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_disable "msie6";
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/javascript
        application/x-javascript
        application/json
        application/xml
        application/xml+rss
        application/wasm
        application/manifest+json
        image/svg+xml
        font/ttf
        font/otf
        font/woff
        font/woff2;
    # text/html 不需要写进 gzip_types：nginx gzip 模块无条件压缩 text/html，
    # 已经生效，不需要显式声明。
    #
    # 需要更高压缩率时可以换成 Brotli：官方 nginx:alpine 镜像不自带 ngx_brotli 模块，
    # 需要换成带模块的镜像（如 fholzer/nginx-brotli）或自行编译；当前流量规模下
    # gzip 的收益/复杂度已经够用，先不引入这个依赖。

    # ---------- 安全响应头 ----------
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # ---------- 容器健康检查 ----------
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # ---------- Vite 产物：带 hash 的静态资源，一年不过期 + immutable ----------
    location ^~ /assets/ {
        access_log off;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # 不带 hash 的静态文件（favicon、public/ 目录下的资源等）：允许缓存，但周期短一些，
    # 避免这类文件更新后用户长期看不到最新版本。
    location ~* \.(?:ico|png|jpg|jpeg|gif|webp|avif|svg|woff2?|ttf|eot)$ {
        access_log off;
        add_header Cache-Control "public, max-age=604800"; # 7 天
        try_files $uri =404;
    }

    # ---------- index.html：永远不缓存 ----------
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
    }

    # ---------- SPA 路由兜底 ----------
    # 任何不匹配上面静态资源规则的路径，都交给 index.html，由前端路由（react-router-dom）
    # 自己决定渲染哪个页面；找不到对应文件时不返回 nginx 默认 404 页。
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;
    }

    # 防止隐藏文件（如意外拷进镜像的 .env）被直接访问到
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    error_page 404 /index.html;
}
