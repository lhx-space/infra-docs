# electron-builder 打包配置（见 apps/desktop/package.json 的 build:mac/win/linux）。
# 产物由 `electron-vite build` 先产出到 out/，electron-builder 再按本文件打包成安装包。
appId: com.lhxspace.infra-docs
productName: Yjs Docs
directories:
  buildResources: build
files:
  - '!**/.vscode/*'
  - '!src/*'
  - '!electron.vite.config.{js,ts,mjs,cjs}'
  - '!{.eslintcache,eslint.config.mjs,.prettierignore,.prettierrc.yaml,dev-app-update.yml,CHANGELOG.md,README.md}'
  - '!{.env,.env.*,.npmrc,pnpm-lock.yaml}'
  - '!{tsconfig.json,tsconfig.node.json,tsconfig.web.json}'
asarUnpack:
  - resources/**
win:
  executableName: yjs-docs
  target:
    - nsis
nsis:
  artifactName: yjs-docs-${version}-setup.${ext}
  shortcutName: Yjs Docs
  uninstallDisplayName: Yjs Docs
  createDesktopShortcut: always
mac:
  entitlementsInherit: build/entitlements.mac.plist
  extendInfo:
    - NSCameraUsageDescription: Application requests access to the device's camera.
    - NSMicrophoneUsageDescription: Application requests access to the device's microphone.
    - NSDocumentsFolderUsageDescription: Application requests access to the user's Documents folder.
    - NSDownloadsFolderUsageDescription: Application requests access to the user's Downloads folder.
  # 未配置 Apple 签名/公证凭证时保持 false，产物为未签名 dmg/zip（本地双击需右键打开）。
  # 正式发布前接入 Apple 签名 + notarize 后再打开。
  notarize: false
  target:
    - dmg
    - zip
dmg:
  artifactName: yjs-docs-${version}-${arch}.${ext}
linux:
  target:
    - AppImage
    - deb
  maintainer: lhx-space
  category: Utility
  artifactName: yjs-docs-${version}-${arch}.${ext}
appImage:
  artifactName: yjs-docs-${version}-${arch}.${ext}
npmRebuild: false
# 供 electron-updater 自动更新使用（provider: github 需要 GH_TOKEN）。当前发布走
# .github/workflows/release.yml 里 `--publish never` + softprops/action-gh-release，
# 这里只声明 provider，自动更新后续接入时直接复用。
publish:
  provider: github
  owner: lhx-space
  repo: infra-docs
