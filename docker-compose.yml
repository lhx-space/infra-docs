services:
  api:
    build: ./apps/api
    ports:
      - '3000:3000'
    env_file:
      - ./apps/api/.env
    depends_on:
      - postgres
      - redis
    restart: unless-stopped
    profiles: ["full"]

  postgres:
    container_name: yjs-docs-postgres
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
      POSTGRES_DB: ${POSTGRES_DB:-yjs-docs}
    ports:
      - '5432:5432'
    volumes:
      - ./.data/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-user}']
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  redis:
    container_name: yjs-docs-redis
    image: redis:7-alpine
    ports:
      - '6379:6379'
    volumes:
      - ./data/redis:/data
    restart: unless-stopped

  minio:
    container_name: yjs-docs-minio
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    ports:
      - '9000:9000' # S3 API
      - '9001:9001' # 管理控制台
    volumes:
      - ./.data/minio:/data
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped
