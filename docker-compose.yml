services:
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    ports:
      - '3000:3000'
    env_file:
      - ./apps/api/.env
    depends_on:
      - postgres
      - redis
      - minio
    restart: unless-stopped
    profiles: ["full"]

  # 纯静态 SPA（Vite 产物），见 apps/web/Dockerfile 顶部说明。VITE_API_BASE_URL 是编译期
  # 常量，构建完成后固化进产物，这里通过 build.args 传入——换 API 地址需要重新 build，
  # 不是运行时环境变量能解决的（跟 api/worker/collab-server 几个服务不同）。
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:3000}
    ports:
      - '5173:80'
    depends_on:
      - api
    restart: unless-stopped
    profiles: ["full"]

  # 视频转码 worker（见 video-hls-embed design.md 决策 2）：跟 api 复用同一个镜像/构建产物，
  # 只是启动命令换成 src/worker.ts 编译后的产物——不与 HTTP API 共用进程，避免 ffmpeg 转码
  # 这种 CPU 密集任务拖慢请求处理。同样需要 ffmpeg（已在 Dockerfile 里装好）与 Redis（BullMQ
  # 队列）、MinIO（读原始文件、写转码产物）。
  worker:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    command: ['node', 'dist/worker.js']
    env_file:
      - ./apps/api/.env
    depends_on:
      - postgres
      - redis
      - minio
    restart: unless-stopped
    profiles: ["full"]

  postgres:
    container_name: yjs-docs-postgres
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
      POSTGRES_DB: ${POSTGRES_DB:-yjs-docs}
    ports:
      - '5432:5432'
    volumes:
      - ./.data/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-user}']
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  redis:
    container_name: yjs-docs-redis
    image: redis:7-alpine
    ports:
      - '6379:6379'
    volumes:
      - ./data/redis:/data
    restart: unless-stopped

  minio:
    container_name: yjs-docs-minio
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    ports:
      - '9000:9000' # S3 API
      - '9001:9001' # 管理控制台
    volumes:
      - ./.data/minio:/data
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped
