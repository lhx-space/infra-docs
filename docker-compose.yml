services:
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    ports:
      - '3000:3000'
      # gRPC server 端口（见 yjs-realtime-collaboration design.md 决策 10），只服务
      # collab-server 的内部调用，跟 3000（HTTP REST）是完全独立的监听。不用 4001
      # 是因为本机实测会跟 macOS 上 QQ 桌面客户端占用的端口撞车（见 apps/api/src/env.ts
      # 里 GRPC_PORT 的注释）。
      - '4011:4011'
    env_file:
      - ./apps/api/.env
    # `env_file` 里的 `.env` 是面向"本机直接跑 `pnpm dev`/`node dist/server.js`"这种场景
    # 编写的（`DATABASE_URL`/`REDIS_URL`/`MINIO_ENDPOINT` 都是 `localhost`），在容器网络
    # 里这些地址指向的是 `api` 容器自己，连不到 `postgres`/`redis`/`minio` 这几个邻居容器
    # （之前排查 system-performance-hardening 端到端验证时发现的真实缺陷，`docker-compose
    # up` 这条路径此前跑不起来）。`environment` 在同名 key 上的优先级高于 `env_file`（见
    # Docker Compose 官方合并顺序），这里只覆盖这三个需要跨容器访问的地址，换成 Compose
    # 默认网络自带的服务名 DNS（`postgres`/`redis`/`minio`），其余变量（`JWT_SECRET`/
    # `PORT`/`GRPC_PORT` 等）继续从 `.env` 读，不需要在这里重复维护。
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-user}:${POSTGRES_PASSWORD:-password}@postgres:5432/${POSTGRES_DB:-yjs-docs}?schema=public
      REDIS_URL: redis://redis:6379
      MINIO_ENDPOINT: minio
    depends_on:
      - postgres
      - redis
      - minio
    restart: unless-stopped
    profiles: ["full"]

  # 纯静态 SPA（Vite 产物），见 apps/web/Dockerfile 顶部说明。VITE_API_BASE_URL/
  # VITE_COLLAB_WS_URL 都是编译期常量，构建完成后固化进产物，这里通过 build.args 传入——
  # 换地址需要重新 build，不是运行时环境变量能解决的（跟 api/worker/collab-server 几个
  # 服务不同）。两者都保持指向 `localhost`（默认值）而不是服务名——跟 api/worker/
  # collab-server 那几个不一样，这两个地址是给*浏览器*用的（浏览器运行在宿主机上，
  # 不在 docker 网络里面，只能通过发布出来的宿主机端口访问），不能换成容器服务名。
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:3000}
        VITE_COLLAB_WS_URL: ${VITE_COLLAB_WS_URL:-ws://localhost:4000/ws}
    ports:
      - '5173:80'
    depends_on:
      - api
    restart: unless-stopped
    profiles: ["full"]

  # 视频转码 worker（见 video-hls-embed design.md 决策 2）：跟 api 复用同一个镜像/构建产物，
  # 只是启动命令换成 src/worker.ts 编译后的产物——不与 HTTP API 共用进程，避免 ffmpeg 转码
  # 这种 CPU 密集任务拖慢请求处理。同样需要 ffmpeg（已在 Dockerfile 里装好）与 Redis（BullMQ
  # 队列）、MinIO（读原始文件、写转码产物）。
  worker:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    command: ['node', 'dist/worker.js']
    env_file:
      - ./apps/api/.env
    # 跟上面 `api` service 同样的原因、同样的修复方式，见那边的注释。
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-user}:${POSTGRES_PASSWORD:-password}@postgres:5432/${POSTGRES_DB:-yjs-docs}?schema=public
      REDIS_URL: redis://redis:6379
      MINIO_ENDPOINT: minio
    depends_on:
      - postgres
      - redis
      - minio
    restart: unless-stopped
    profiles: ["full"]

  # 实时协同服务（见 openspec/changes/yjs-realtime-collaboration design.md 决策 1）：
  # Rust（Axum + yrs/y-sync）实现，跟 api/worker 一样是独立进程，但技术栈不同——不复用
  # apps/api 的镜像/Dockerfile，走独立的 apps/collab-server/Dockerfile。跟 apps/api 之间
  # 通过 gRPC 通信（决策 2/10），需要 apps/api 暴露的 gRPC 端口可达。
  collab-server:
    build:
      context: .
      dockerfile: apps/collab-server/Dockerfile
    ports:
      - '4000:4000'
    env_file:
      - ./apps/collab-server/.env
    # 跟上面 `api`/`worker` 同样的原因：`.env` 里的 `DATABASE_URL`/`API_GRPC_ADDR` 是面向
    # 本机直接跑 `cargo run` 编写的（`localhost`/`127.0.0.1`），容器网络里换成服务名。
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-user}:${POSTGRES_PASSWORD:-password}@postgres:5432/${POSTGRES_DB:-yjs-docs}
      API_GRPC_ADDR: http://api:4011
    depends_on:
      - postgres
      - api
    restart: unless-stopped
    profiles: ["full"]

  # AI 服务（见 openspec/changes/ai-assistant design.md 决策 1/5/13）：Rust（Rig + Axum +
  # tonic + sqlx + redis）实现，跟 collab-server 一样走独立 Dockerfile。SSE 端点对
  # web/desktop 暴露（4100），通过 gRPC 调用 apps/api 拿权限/文档范围/变更枚举。
  ai-server:
    build:
      context: .
      dockerfile: apps/ai-server/Dockerfile
    ports:
      - '4100:4100'
    env_file:
      - ./apps/ai-server/.env
    # 容器网络里把本机开发的 localhost 地址换成服务名（跟 collab-server 同一套原因）。
    # AI_PROVIDER/API_KEY/MODEL 等继续从 .env 读；OLLAMA_BASE_URL 指向同网络的 ollama。
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-user}:${POSTGRES_PASSWORD:-password}@postgres:5432/${POSTGRES_DB:-yjs-docs}
      API_GRPC_ADDR: http://api:4011
      REDIS_URL: redis://redis:6379
      OLLAMA_BASE_URL: http://ollama:11434
    depends_on:
      - postgres
      - redis
      - api
    restart: unless-stopped
    profiles: ["full"]

  # 本地模型基础设施层（见 design.md 决策 14）：与 postgres/redis/minio 同级。macOS 的
  # Docker 无 GPU（Metal 不可用），容器内 Ollama 只能 CPU 推理；本地开发更建议宿主机
  # 原生 Ollama（brew install ollama）用 Metal 加速，ai-server 用
  # OLLAMA_BASE_URL=http://host.docker.internal:11434 连宿主机。模型不随镜像打包，首次
  # 使用需 `docker compose exec ollama ollama pull <model>`。
  ollama:
    container_name: yjs-docs-ollama
    image: ollama/ollama
    ports:
      - '11434:11434'
    volumes:
      - ./.data/ollama:/root/.ollama
      # 自动拉取模型脚本（见 ollama-entrypoint.sh）：容器启动时先 serve 再 pull OLLAMA_MODELS
      - ./apps/ai-server/db/ollama-entrypoint.sh:/entrypoint.sh:ro
    environment:
      # 要自动拉取的模型列表（空格分隔）：对话模型 + embedding 模型
      # 用 3b 而非 7b：macOS Docker 默认内存约 3.8GB，7b 需 4.3GB 会 OOM（见 ai-assistant design.md）
      OLLAMA_MODELS: ${OLLAMA_MODELS:-qwen2.5:3b nomic-embed-text}
    entrypoint: ["/bin/sh", "/entrypoint.sh"]
    restart: unless-stopped

  postgres:
    container_name: yjs-docs-postgres
    # pgvector 镜像（自带 vector 扩展文件）：RAG 向量检索用（见 openspec/changes/ai-assistant
    # design.md 决策 12）。换成官方 `postgres:16-alpine` 需自行安装 pgvector 扩展。
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
      POSTGRES_DB: ${POSTGRES_DB:-yjs-docs}
    ports:
      - '5432:5432'
    volumes:
      - ./.data/postgres:/var/lib/postgresql/data
      # 首次初始化数据卷时执行：CREATE EXTENSION vector + 建 RAG 向量表。
      # 注意：对已存在的数据卷（./.data/postgres 已有数据）不会重新执行，需手动
      # `docker compose exec postgres psql -U ${POSTGRES_USER:-user} -d ${POSTGRES_DB:-yjs-docs} \
      #   -c "CREATE EXTENSION IF NOT EXISTS vector;"` 并按 001_pgvector.sql 建表。
      - ./apps/ai-server/db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-user}']
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  redis:
    container_name: yjs-docs-redis
    image: redis:7-alpine
    ports:
      - '6379:6379'
    volumes:
      - ./.data/redis:/data
    restart: unless-stopped

  minio:
    container_name: yjs-docs-minio
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    ports:
      - '9000:9000' # S3 API
      - '9001:9001' # 管理控制台
    volumes:
      - ./.data/minio:/data
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped
