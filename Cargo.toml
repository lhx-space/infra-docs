[workspace]
resolver = "2"
members = ["apps/collab-server"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "UNLICENSED"

# 依赖版本统一在这里管理，各 crate 用 `{ workspace = true }` 引用，避免多个 crate
# 各装一份不同版本导致行为不一致（跟 `apps/collab-server/Cargo.toml` 的用法保持一致）。
[workspace.dependencies]
# 异步运行时
tokio = { version = "1", features = ["full"] }

# Web / WebSocket 框架
axum = { version = "0.7", features = ["macros", "ws"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["cors", "trace"] }

# gRPC（服务间通信，见 openspec/changes/yjs-realtime-collaboration/design.md 决策 10）
tonic = "0.12"
prost = "0.13"

# Yjs 协议兼容的 CRDT 实现（见 design.md 决策 1）。
#
# 版本说明（实现阶段发现并修正）：立项时选的 `yrs 0.21` 与 `y-sync`（提供 WebSocket
# 同步协议的房间广播/连接管理，见 apps/collab-server/src/service/collab.rs）实际锁定的
# `yrs 0.17` 不兼容——`y-sync` 自 2023-11 发布 0.4.0 后未再更新，其内部固定依赖
# `yrs = "0.17"`，两个不同大版本的 `yrs::Doc`/`Awareness` 类型无法互相传递。降级到
# `0.17` 消除这个冲突；Yjs 二进制同步协议本身（这才是"协议兼容"真正依赖的部分）在
# yrs 各版本间保持稳定，不受这个降级影响。
yrs = "0.17"
# `net` feature 提供 `BroadcastGroup`/`Subscription`（基于 tokio broadcast channel 的
# 房间广播实现），是 apps/collab-server 真正要用的部分（默认 feature 不含它）。
y-sync = { version = "0.4", features = ["net"] }
# 把 axum::extract::ws::WebSocket 的 Sink<Message>/Stream 适配成 y-sync 要求的
# Sink<Vec<u8>>/Stream<Item=Result<Vec<u8>,E>>（见 service/ws_adapter.rs），需要
# "sink" feature 才能用 Sink trait（跟 y-sync 自己声明这个 feature 的方式一致）。
futures-util = { version = "0.3", features = ["sink"] }

# 数据库
sqlx = { version = "0.8", features = ["runtime-tokio", "postgres", "chrono", "json", "uuid"] }

# 鉴权（见 design.md 决策 3：本地校验 access token 签名，与 apps/api 共享 JWT_SECRET）。
# 9.x 存在一处类型混淆可能导致鉴权绕过的漏洞（GHSA，见 Dependabot alert #3），10.3.0
# 已修复；HS256 + 固定 secret 的最小用法（utils/jwt.rs）在 9→11 之间没有 API 变化，
# 直接升到修复版本。
jsonwebtoken = "11"

# 序列化
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# 错误处理
anyhow = "1"
thiserror = "1"

# 日志
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# 工具类
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
dotenvy = "0.15"
